<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Gmail Auto Creator</title>
<style>
  body { font-family: Arial; background:#1a1a2e; color:#eee; padding:30px; }
  .box { max-width:500px; margin:auto; background:#16213e; padding:25px; border-radius:12px; }
  input, button { width:100%; padding:10px; margin:8px 0; border-radius:6px; border:none; }
  input { background:#0f3460; color:#fff; }
  button { background:#e94560; color:#fff; cursor:pointer; font-weight:bold; }
  #log { background:#000; padding:10px; height:200px; overflow:auto; font-size:12px; margin-top:15px; border-radius:6px; }
</style>
</head>
<body>
<div class="box">
  <h2>Buat Akun Gmail</h2>
  <input id="nama" placeholder="Nama Depan">
  <input id="nama2" placeholder="Nama Belakang">
  <input id="user" placeholder="Username (tanpa @gmail)">
  <input id="pass" placeholder="Password" type="text">
  <button onclick="buat()">Buat Akun</button>
  <div id="log"></div>
</div>
<script>
function log(m){ document.getElementById('log').innerHTML += m + "<br>"; }

async function buat(){
  const nama = document.getElementById('nama').value;
  const nama2 = document.getElementById('nama2').value;
  const user = document.getElementById('user').value;
  const pass = document.getElementById('pass').value;

  if(!nama || !user || !pass){ log("⚠ Isi semua field"); return; }

  log("▶ Memulai pendaftaran: " + user + "@gmail.com");

  // Endpoint signup Google (internal, tanpa telepon)
  const payload = {
    "accountForm": {
      "firstName": nama,
      "lastName": nama2,
      "username": user,
      "password": pass,
      "birthday": {"day":1,"month":1,"year":2000},
      "gender": 1
    },
    "deviceInfo": {
      "deviceId": "android-" + Math.random().toString(36).slice(2,12),
      "os": "Android",
      "model": "Pixel 5",
      "appVersion": "12.0.0"
    }
  };

  log("▶ Mengirim request ke endpoint signup...");

  try {
    const res = await fetch("https://android.googleapis.com/account/signup", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "User-Agent": "Google-Android/12.0.0 (Pixel 5)"
      },
      body: JSON.stringify(payload)
    });

    const data = await res.json();
    log("◀ Response: " + JSON.stringify(data));

    if(data.success){
      log("✅ Akun berhasil dibuat: " + user + "@gmail.com");
    } else {
      log("❌ Gagal: " + (data.error || "Username sudah dipakai / diblokir"));
      log("→ Coba ganti username atau tambah angka");
    }
  } catch(e){
    log("❌ Error jaringan: " + e.message);
  }
}
</script>
</body>
</html>
